name: Preuzmi logo
on:
  push:
    paths: ['.github/workflows/fetch-logo.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL https://restoranpolaris.com/assets/img/polarislogo.png -o polaris-logo.png
          file polaris-logo.png
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add polaris-logo.png
          git commit -m "Dodaj Polaris logo" || true
          git push
